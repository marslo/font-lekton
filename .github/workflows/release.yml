---
name: release

# semantic-release: tag + CHANGELOG + GitHub release, with the two font zips attached. releaserc lives in .releaserc.js.
# on-demand only — run it manually from the Actions tab ( or `gh workflow run release.yml` ).
on:
  workflow_dispatch:

permissions:
  contents: write        # push CHANGELOG + create tags/releases
  issues: write          # semantic-release comments
  pull-requests: write   # semantic-release comments

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ( full history + tags )
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          # semantic-release >= 26 requires node >= 26.13; on an older node npm silently falls back to semantic-release 25
          node-version: 26

      - name: Setup Python ( for the pre-commit prepareCmd )
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Build font zips
        run: |
          zip -r Lekton-Optimized.zip optimized
          zip -r LektonLig.zip LektonLig
          zip -r LektonLig-NerdFont.zip LektonLigNF
          ls -la Lekton*.zip

      # majors pinned: semantic-release 26 renders notes with its bundled release-notes-generator 15 / conventional-changelog-writer 9
      # ( function templates, see .releaserc.js ); a standalone @semantic-release/release-notes-generator is not used
      - name: Install semantic-release
        run: |
          npm install --no-save \
            semantic-release@26 \
            @semantic-release/commit-analyzer@13 \
            @semantic-release/changelog@7 \
            @semantic-release/exec@7 \
            @semantic-release/git@11 \
            @semantic-release/github@12 \
            conventional-changelog-conventionalcommits@10
          npx semantic-release --version

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
